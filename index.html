<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내전 경매</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+KR:wght@500;600;700&display=swap');
  :root{
    --bg:#0a0603;
    --bg-2:#120b06;
    --surface:#1a120a;
    --surface-2:#241708;
    --surface-3:#2f1d0c;
    --border:#4a3417;
    --border-soft:#2c1f10;
    --text:#ecdec2;
    --text-dim:#b3a181;
    --text-faint:#786646;
    --accent:#c9a13a;
    --accent-strong:#eccb6c;
    --accent-dim:#3a2b10;
    --accent-ink:#1a1206;
    --good:#5fae7f;
    --good-dim:#132018;
    --bad:#c0524a;
    --bad-dim:#241110;
    --focus:#eccb6c;
    --shadow-card:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -10px rgba(0,0,0,.7);
    --radius:14px;
    --radius-sm:9px;
    --font-display:'Cinzel','Pretendard Variable','Malgun Gothic',serif;
    --font-serif-kr:'Noto Serif KR','Cinzel','Malgun Gothic',serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 20% -10%, rgba(120,80,20,.16), transparent 60%),
      radial-gradient(ellipse 900px 600px at 100% 0%, rgba(90,50,10,.12), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:"Pretendard Variable","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea{ font-family:inherit; color:inherit; }
  h1,h2,h3{ margin:0; text-wrap:balance; }
  .num{ font-variant-numeric:tabular-nums; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  /* ---------- shell ---------- */
  #app{ min-height:100vh; display:flex; flex-direction:column; }
  @media (min-width:900px){
    #app:not(.captain-app){ min-width:1080px; overflow-x:auto; }
  }
  .header{
    height:56px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px;
    background:linear-gradient(var(--bg-2),var(--bg-2)) padding-box;
    border-bottom:1px solid var(--border);
    box-shadow:0 2px 14px -6px rgba(0,0,0,.6), inset 0 -1px 0 rgba(201,161,58,.12);
    position:relative; z-index:1;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand-mark{
    font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:.06em;
    color:var(--accent-strong); text-transform:uppercase;
    text-shadow:0 0 14px rgba(236,203,108,.25);
  }
  .brand-sub{ font-size:12px; color:var(--text-faint); }
  .header-mid{ font-size:13px; color:var(--text-dim); }
  .header-right{ display:flex; align-items:center; gap:8px; }

  .btn{
    appearance:none; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); padding:8px 14px; border-radius:var(--radius-sm);
    font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
    transition:background-color .12s, border-color .12s, opacity .12s, transform .05s, box-shadow .12s;
  }
  .btn:hover:not(:disabled){ background:var(--surface-3); border-color:var(--accent); box-shadow:0 0 0 1px rgba(201,161,58,.15); }
  .btn:active:not(:disabled){ transform:translateY(1px); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-accent{ background:linear-gradient(180deg,var(--accent-strong),var(--accent)); border-color:var(--accent-strong); color:var(--accent-ink); font-weight:700; }
  .btn-accent:hover:not(:disabled){ background:var(--accent-strong); border-color:var(--accent-strong); box-shadow:0 0 16px -2px rgba(236,203,108,.5); }
  .btn-ghost{ background:transparent; }
  .btn-danger{ border-color:var(--bad); color:var(--bad); }
  .btn-danger:hover:not(:disabled){ background:var(--bad-dim); }
  .btn-sm{ padding:5px 10px; font-size:12px; }
  .btn-block{ width:100%; }

  /* ---------- setup ---------- */
  .setup-shell{ flex:1; overflow-y:auto; padding:32px 20px 60px; }
  .setup-grid{ max-width:920px; margin:0 auto; display:flex; flex-direction:column; gap:20px; }
  .setup-title{ font-family:var(--font-display); font-size:23px; font-weight:700; letter-spacing:.02em; margin-bottom:2px; color:var(--accent-strong); }
  .setup-lede{ color:var(--text-dim); font-size:13px; margin-bottom:8px; }
  .card{
    position:relative;
    background:linear-gradient(180deg,var(--surface),var(--bg-2)); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; box-shadow:var(--shadow-card), inset 0 0 0 1px rgba(201,161,58,.05);
  }
  .card::before{
    content:""; position:absolute; left:16px; right:16px; top:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(201,161,58,.55),transparent);
  }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .card-head h2{ font-family:var(--font-display); font-size:14px; font-weight:700; letter-spacing:.04em; color:var(--accent-strong); text-transform:uppercase; }
  .card-head .hint{ font-size:12px; color:var(--text-faint); }
  .field-label{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:4px; }
  input[type=text], input[type=number], textarea, select{
    background:var(--bg-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius-sm); padding:8px 10px; font-size:13px; width:100%;
  }
  input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus{
    border-color:var(--accent); outline:none; box-shadow:0 0 0 3px rgba(201,161,58,.15);
  }
  input[type=number]{ font-variant-numeric:tabular-nums; }
  textarea{ resize:vertical; min-height:88px; font-family:inherit; }

  .team-row{
    display:grid; grid-template-columns:1fr 120px 100px 32px; gap:10px; align-items:end;
    padding:10px 0; border-bottom:1px solid var(--border-soft);
  }
  .team-row:last-child{ border-bottom:none; }
  @media (max-width:560px){
    .team-row{ grid-template-columns:1fr 1fr; }
    .team-row > div:first-child{ grid-column:1/-1; }
  }
  .row-remove{
    width:32px; height:32px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-dim); cursor:pointer; font-size:15px; line-height:1;
  }
  .row-remove:hover{ background:var(--bad-dim); color:var(--bad); border-color:var(--bad); }

  .waiting-team-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--border-soft);
  }
  .waiting-team-row:last-child{ border-bottom:none; }
  .waiting-team-name{ font-weight:700; font-size:14px; color:var(--text); }

  .config-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; }

  .player-count{ font-size:12px; color:var(--text-faint); margin:10px 0 6px; }
  .player-table{ display:flex; flex-direction:column; gap:4px; overflow-x:auto; }
  .player-table .player-row, .player-table .player-row.head{ min-width:780px; }
  .player-row{
    display:grid; grid-template-columns:36px minmax(120px,1fr) 84px 148px 148px 148px minmax(160px,1fr) 30px;
    gap:8px; align-items:center;
  }
  .player-row.head{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; padding:0 0 2px; }
  .pick-search{ display:flex; align-items:center; gap:6px; }
  .pick-search-box{ position:relative; flex:1; min-width:0; }
  .pick-dropdown{
    position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:20;
    background:var(--surface-3); border:1px solid var(--border); border-radius:var(--radius-sm);
    max-height:220px; overflow-y:auto; box-shadow:0 8px 24px -8px rgba(0,0,0,.6);
  }
  .pick-dropdown[hidden]{ display:none; }
  .pick-dropdown-item{
    display:flex; align-items:center; gap:8px; width:100%; padding:6px 8px; border:none; background:none;
    color:var(--text); font-size:12.5px; cursor:pointer; text-align:left;
  }
  .pick-dropdown-item:hover{ background:var(--surface-2); }
  .pdi-icon{ width:22px; height:22px; border-radius:5px; overflow:hidden; flex:0 0 auto; background:var(--surface-2); }
  .pdi-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pdi-name{ flex:1; }
  .pick-icon{
    position:relative; width:26px; height:26px; flex:0 0 auto; border-radius:6px; overflow:hidden;
    border:1px solid var(--border); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
  }
  .pick-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pick-icon .pick-fallback-text{ display:none; font-size:7px; text-align:center; padding:1px; color:var(--text-faint); line-height:1.05; word-break:break-all; }
  .pick-icon.fallback .pick-fallback-text{ display:block; }
  .pick-icon.empty{ border-style:dashed; }

  .start-bar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:6px; }
  .start-hint{ font-size:12px; color:var(--bad); min-height:16px; }

  /* ---------- auction layout ---------- */
  .layout{ flex:1; display:grid; grid-template-columns:300px 1fr 300px; min-height:0; }
  .panel{ overflow-y:auto; padding:16px; border-right:1px solid var(--border); background:var(--bg-2); }
  .panel:last-child{ border-right:none; }
  @media (max-width:899px){
    .layout{ grid-template-columns:1fr; overflow-y:auto; }
    .panel{ border-right:none; border-bottom:1px solid var(--border); }
    .panel:nth-child(2){ order:-1; border-bottom:1px solid var(--border); }
  }
  .panel-title{
    font-family:var(--font-display); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.12em;
    color:var(--accent); margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border-soft);
  }

  /* team cards */
  .team-card{
    position:relative;
    background:linear-gradient(180deg,var(--surface),var(--bg-2)); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 12px 14px; margin-bottom:12px; transition:border-color .15s, box-shadow .15s;
    box-shadow:var(--shadow-card);
  }
  .team-card.leading{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset, 0 0 18px -4px rgba(201,161,58,.55); }
  .team-card-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .team-card-name{ font-weight:700; font-size:13.5px; color:var(--text); }
  .team-card-pts{ font-size:12.5px; color:var(--accent-strong); font-weight:700; }
  .team-card-pts .total{ color:var(--text-faint); font-weight:500; }
  .position-chips{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  .position-chip{
    font-size:10px; font-weight:600; padding:2px 8px; border-radius:999px;
    border:1px solid var(--border); color:var(--text-faint); background:var(--bg-2);
  }
  .position-chip.filled{ border-color:var(--accent); color:var(--accent-strong); background:var(--accent-dim); }
  .slots{ display:flex; flex-wrap:wrap; gap:5px; }
  .slot{
    flex:1 1 auto; min-width:64px; border-radius:var(--radius-sm); padding:5px 7px;
    font-size:11px; border:1px dashed var(--border);
    color:var(--text-faint); background:var(--bg-2);
  }
  .slot.filled{ border-style:solid; border-color:var(--border); color:var(--text); background:var(--surface-2); }
  .slot .slot-name{ display:block; font-weight:600; color:var(--text); }
  .slot .slot-price{ color:var(--accent-strong); font-variant-numeric:tabular-nums; }

  /* stage */
  .stage{ display:flex; flex-direction:column; padding:20px; gap:14px; overflow-y:auto; }
  .stage-empty{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; color:var(--text-dim); padding:40px 20px;
  }

  /* ---- most-pick showcase card (content.png template) ---- */
  .showcase-wrap{ width:100%; max-width:820px; margin:0 auto; }
  .showcase-kicker{
    display:flex; justify-content:flex-end; margin-bottom:6px;
    font-family:var(--font-display); font-size:11px; letter-spacing:.14em;
    color:var(--text-faint); text-transform:uppercase;
  }
  .showcase-card{
    container-type:inline-size;
    position:relative; width:100%; aspect-ratio:1677/938; border-radius:6px; overflow:hidden;
    background:#0a0603 url('content.png') center/100% 100% no-repeat;
    box-shadow:0 16px 44px -16px rgba(0,0,0,.85), 0 0 0 1px rgba(201,161,58,.18);
  }
  .showcase-pick{
    position:absolute; top:24.84%; height:26.76%; border-radius:2px; overflow:hidden; background:#0e0a06;
  }
  .showcase-pick img{ width:100%; height:100%; object-fit:cover; display:block; }
  .showcase-pick .pick-fallback-text{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    font-size:9px; color:var(--text-faint); text-align:center; padding:4px; line-height:1.2;
  }
  .showcase-pick.fallback .pick-fallback-text{ display:flex; }
  .showcase-pick.p1{ left:42.6%; width:14.95%; }
  .showcase-pick.p2{ left:59.82%; width:15.02%; }
  .showcase-pick.p3{ left:77.0%; width:15.08%; }
  .showcase-portrait-box{
    position:absolute; left:9.3%; top:13.97%; width:26.9%; height:72.3%;
    border-radius:2px; overflow:hidden;
  }
  .showcase-portrait-img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:top center; display:block;
  }
  .showcase-portrait-box::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:46%;
    background:linear-gradient(to top, rgba(0,0,0,.8), transparent); pointer-events:none;
  }
  .showcase-portrait-name{
    position:absolute; left:4%; right:4%; bottom:5%; z-index:1;
    font-family:var(--font-display); font-weight:700; letter-spacing:.03em;
    color:var(--accent-strong); text-shadow:0 2px 10px rgba(0,0,0,.9);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center;
    font-size:30px; font-size:3.8cqw;
  }
  .showcase-meta-zone{
    position:absolute; left:36.3%; right:1.7%; top:62%; height:22%;
    display:flex; flex-direction:row; align-items:center; gap:12px; padding:0 1.5%;
  }
  .showcase-meta-zone .badge-pos{ flex:0 0 auto; }
  .showcase-desc{
    flex:1 1 auto; min-width:0;
    font-family:var(--font-serif-kr); font-weight:600; color:var(--text);
    letter-spacing:.02em; line-height:1.35;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical;
    font-size:17px; font-size:2.1cqw;
  }
  .showcase-desc::before{ content:"\201C"; color:var(--accent); margin-right:2px; font-style:normal; }
  .showcase-desc::after{ content:"\201D"; color:var(--accent); margin-left:1px; font-style:normal; }
  .showcase-desc.empty{ visibility:hidden; }

  .player-card{
    background:linear-gradient(180deg,var(--surface),var(--bg-2)); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 24px; box-shadow:var(--shadow-card);
  }
  .badge-pos{
    font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--border);
    color:var(--text-dim); background:var(--surface-2);
  }
  .bid-now{ display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .bid-amount-wrap{ display:flex; flex-direction:column; gap:2px; }
  .bid-amount-label{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; }
  .bid-amount{ font-size:34px; font-weight:800; color:var(--accent-strong); }
  .bid-team{ font-size:14px; color:var(--text-dim); }
  .timer-box{ display:flex; align-items:center; gap:12px; }
  .timer-num{ font-size:40px; font-weight:800; min-width:64px; text-align:right; color:var(--text); }
  .timer-box.urgent .timer-num{ color:var(--bad); }
  .timer-bar{ width:100px; height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; }
  .timer-fill{ height:100%; background:var(--accent); transition:width 1s linear; }
  .timer-box.urgent .timer-fill{ background:var(--bad); }
  @media (prefers-reduced-motion:no-preference){
    .timer-box.urgent .timer-num{ animation:pulse 1s ease-in-out infinite; }
  }
  @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.5 } }
  .timer-controls{ display:flex; gap:6px; }

  .result-banner{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:var(--good-dim); border:1px solid var(--good); border-radius:var(--radius);
    padding:14px 18px;
  }
  .result-banner.passed{ background:var(--bad-dim); border-color:var(--bad); }
  .result-banner strong{ font-family:var(--font-display); font-size:16px; letter-spacing:.02em; }

  .controls-card{
    background:linear-gradient(180deg,var(--surface),var(--bg-2)); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow-card);
  }
  .controls-row-title{ font-family:var(--font-display); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); margin-bottom:8px; }
  .team-bid-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .team-bid-btn{
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    border:1px solid var(--border); background:var(--surface-2); border-radius:var(--radius-sm);
    padding:8px 10px; cursor:pointer; text-align:left; transition:border-color .12s, background-color .12s, box-shadow .12s;
  }
  .team-bid-btn:hover:not(:disabled){ border-color:var(--accent); background:var(--surface-3); box-shadow:0 0 0 1px rgba(201,161,58,.15); }
  .team-bid-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .team-bid-btn .tb-name{ font-weight:700; font-size:12.5px; color:var(--text); }
  .team-bid-btn .tb-amount{ font-size:12px; color:var(--accent-strong); font-variant-numeric:tabular-nums; }
  .custom-bid-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .custom-bid-row select, .custom-bid-row input{ width:auto; }
  .action-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .error-msg{ font-size:12px; color:var(--bad); min-height:16px; }
  .log-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; max-height:120px; overflow-y:auto; }
  .log-item{ font-size:12px; color:var(--text-dim); display:flex; justify-content:space-between; gap:8px; }
  .log-item .amt{ color:var(--accent-strong); font-variant-numeric:tabular-nums; }

  /* queue panel */
  .queue-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:7px 9px; border-radius:var(--radius-sm); font-size:12.5px; margin-bottom:5px;
    background:var(--surface); border:1px solid var(--border-soft);
  }
  .queue-item .qi-idx{ color:var(--text-faint); width:20px; flex:0 0 auto; }
  .queue-item .qi-name{ flex:1; }
  .passed-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:7px 9px; border-radius:var(--radius-sm); font-size:12.5px; margin-bottom:5px;
    background:var(--bad-dim); border:1px solid var(--border);
  }
  .empty-note{ font-size:12px; color:var(--text-faint); padding:6px 2px; }

  /* finished */
  .finish-shell{ flex:1; overflow-y:auto; padding:32px 20px 60px; }
  .finish-grid{ max-width:960px; margin:0 auto; display:flex; flex-direction:column; gap:20px; }
  .result-teams{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .result-team-card{
    position:relative;
    background:linear-gradient(180deg,var(--surface),var(--bg-2)); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; box-shadow:var(--shadow-card);
  }
  .result-team-card h3{ font-family:var(--font-display); font-size:14px; letter-spacing:.02em; color:var(--accent-strong); margin-bottom:4px; }
  .result-team-card .pts{ font-size:12px; color:var(--text-faint); margin-bottom:10px; }
  .result-roster{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .result-roster li{ display:flex; justify-content:space-between; font-size:12.5px; }
  .result-roster .p-price{ color:var(--accent-strong); font-variant-numeric:tabular-nums; }
  .copy-box{ width:100%; min-height:180px; font-size:12px; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ---------- global toast ---------- */
  .global-toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--surface-3); border:1px solid var(--accent); color:var(--text);
    padding:10px 18px; border-radius:var(--radius-sm); font-size:13px;
    box-shadow:var(--shadow-card); z-index:80; opacity:0; pointer-events:none;
    transition:opacity .2s;
  }

<script>
(function(){

  function normalizeRemoteState(s){

  function shuffle(arr){

  function normKRText(t){ return String(t||"").trim().replace(/\s+/g,"").toLowerCase(); }
  function normENText(t){ return String(t||"").toLowerCase().replace(/[^a-z0-9]/g,""); }

  function matchChampion(text){
    var tKR = normKRText(text);
    var tEN = normENText(text);
    if(!tKR) return null;
    var i;
    for(i=0;i<CHAMP_DB.length;i++){ if(CHAMP_DB[i].normKR===tKR) return CHAMP_DB[i]; }
    if(tEN){ for(i=0;i<CHAMP_DB.length;i++){ if(CHAMP_DB[i].normEN===tEN) return CHAMP_DB[i]; } }
    if(tKR.length>=2){ for(i=0;i<CHAMP_DB.length;i++){ if(CHAMP_DB[i].normKR.indexOf(tKR)===0) return CHAMP_DB[i]; } }
    if(tEN.length>=2){ for(i=0;i<CHAMP_DB.length;i++){ if(CHAMP_DB[i].normEN.indexOf(tEN)===0) return CHAMP_DB[i]; } }

  function filterChampions(query, limit){
    var tKR = normKRText(query);

    var out = [];
    for(var i=0;i<CHAMP_DB.length;i++){
      var c = CHAMP_DB[i];
      if((tKR && c.normKR.indexOf(tKR)!==-1) || (tEN && c.normEN.indexOf(tEN)!==-1)){
        out.push({ idx:i, champ:c });
        if(out.length>=limit) break;
      }
    }
    return out;

    if(IS_CAPTAIN_VIEW) return defaultState();
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed || !parsed.phase) return defaultState();
      return parsed;
    }catch(e){ return defaultState(); }

  function save(){
    if(IS_CAPTAIN_VIEW) return;
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
    if(fbEnabled && roomId){ roomRef().set(state).catch(function(){}); }
  }

  function remainingSlots(team){ return team.slots - team.roster.length; }

  /* every distinct position among registered players, in first-seen order */
  function distinctPositions(){
    var seen = {}; var out = [];
    state.players.forEach(function(p){
      var pos = (p.position||"").trim();
      if(pos && !seen[pos]){ seen[pos]=true; out.push(pos); }
    });
    return out;
  }
  function teamHasPosition(team, position){
    return team.roster.some(function(r){ return (r.position||"").trim()===position; });
  }

  function showError(msg){
    var el = document.getElementById("bidError");
    if(!el) return;
    el.textContent = msg;
    clearTimeout(showError._t);
    showError._t = setTimeout(function(){ if(el) el.textContent=""; }, 3000);
  }

  /* ---------------- actions ---------------- */

  var actions = {};

  actions.addTeam = function(){
    state.teams.push({ id:uid(), name:"", total:1000, slots:5, remaining:1000, roster:[] });
    render(); save();
  };
  actions.removeTeam = function(id){
    state.teams = state.teams.filter(function(t){ return t.id!==id; });
    render(); save();
  };
  actions.loadSample = function(){
    var teamNames = ["레드팀","블루팀","옐로팀","그린팀"];
    state.teams = teamNames.map(function(n){
      return { id:uid(), name:n, total:1000, slots:5, remaining:1000, roster:[] };
    });
    var positions = ["탑","정글","미드","원딜","서폿"];
    var players = [];
    for(var i=1;i<=16;i++){
      var p0 = CHAMP_DB[(i*3)%CHAMP_DB.length].name;
      var p1 = CHAMP_DB[(i*3+1)%CHAMP_DB.length].name;
      var p2 = CHAMP_DB[(i*3+2)%CHAMP_DB.length].name;
      players.push({ id:uid(), name:"선수"+(i<10?"0"+i:i), position:positions[(i-1)%5], picks:[p0,p1,p2], desc:"", status:"queued", soldTeamId:null, price:0 });
    }
    state.players = players;
    render(); save();
  };
  actions.addPlayers = function(){
    var ta = document.getElementById("playersText");
    if(!ta) return;
    var lines = ta.value.split(/\n/).map(function(l){return l.trim();}).filter(Boolean);
    lines.forEach(function(line){
      var parts = line.split(",");
      var name = (parts[0]||"").trim();
      var position = (parts[1]||"").trim();
      var picksRaw = (parts[2]||"").trim();
      var desc = (parts[3]||"").trim();
      var picks = picksRaw ? picksRaw.split("/").map(function(s){return s.trim();}).slice(0,3) : [];
      while(picks.length<3) picks.push("");
      if(!name) return;
      state.players.push({ id:uid(), name:name, position:position, picks:picks, desc:desc, status:"queued", soldTeamId:null, price:0 });
    });
    ta.value = "";
    render(); save();
  };
  actions.removePlayer = function(id){
    state.players = state.players.filter(function(p){ return p.id!==id; });
    render(); save();
  };

  var pendingPhotoPlayerId = null;
  actions.pickPlayerPhoto = function(playerId){
    pendingPhotoPlayerId = playerId;
    var input = document.getElementById("photoFileInput");
    if(input) input.click();
  };

  function canStart(){
    if(state.teams.length < 2) return false;
    if(state.players.length < 1) return false;
    for(var i=0;i<state.teams.length;i++){
      var t = state.teams[i];
      if(!t.name || !t.name.trim()) return false;
      if(!(t.total>0)) return false;
      if(!(t.slots>=1)) return false;
    }
    return true;
  }

  actions.startAuction = function(){
    if(!canStart()) return;
    if(fbEnabled && !roomId){
      roomId = genRoomId();
      try{ localStorage.setItem(ROOM_ID_KEY, roomId); }catch(e){}
      attachSync();
    }
    state.phase = "waiting";
    render(); save();
  };
  actions.backToSetup = function(){
    state.phase = "setup";
    render(); save();
  };
  actions.beginBidding = function(){
    state.teams.forEach(function(t){ t.remaining = t.total; t.roster=[]; });
    state.players.forEach(function(p){ p.status="queued"; p.soldTeamId=null; p.price=0; });
    state.order = shuffle(state.players.map(function(p){return p.id;}));
    state.passedOrder = [];
    state.current = null;
    state.log = [];
    state.phase = "auction";
    goNext();
  };

  function goNext(){
    if(state.order.length===0){
      state.current = null;
      if(state.passedOrder.length===0){
        state.phase = "finished";
      }
      render(); save();
      return;
    }
    var pid = state.order.shift();
    var player = findPlayer(pid);
    if(player) player.status = "active";
    state.current = {
      playerId: pid, bid:0, bidTeamId:null, history:[],
      timerValue: state.config.timerSeconds, timerRunning:true, resolved:false, resultText:""
    };
    render(); save();
  }
  actions.nextPlayer = goNext;

  function applyBid(teamId, amount){
    var cur = state.current;
    if(!cur || cur.resolved) return;
    var team = findTeam(teamId);
    if(!team){ return; }
    if(cur.bidTeamId===teamId){ showError("이미 최고 입찰 팀입니다"); return; }
    if(remainingSlots(team)<=0){ showError(team.name+" 로스터가 가득 찼습니다"); return; }
    var curPlayer = findPlayer(cur.playerId);
    var curPos = curPlayer && curPlayer.position ? curPlayer.position.trim() : "";
    if(curPos && teamHasPosition(team, curPos)){ showError(team.name+"에 이미 "+curPos+" 포지션 선수가 있습니다"); return; }
    if(!(amount>0)){ showError("올바른 금액을 입력하세요"); return; }
    if(amount<=cur.bid){ showError("현재가보다 높은 금액을 입력하세요"); return; }
    if(amount>team.remaining){ showError(team.name+"의 포인트가 부족합니다"); return; }

    if(fbEnabled && roomId){
      /* transaction scoped to /current so simultaneous bids from different
         captains resolve atomically against the freshest server value */
      roomRef("current").transaction(function(remoteCur){
        if(remoteCur==null) return remoteCur;
        if(remoteCur.resolved) return;
        if(remoteCur.bidTeamId===teamId) return;
        if(amount<=remoteCur.bid) return;
        remoteCur.bid = amount;
        remoteCur.bidTeamId = teamId;
        remoteCur.history = [{ teamName:team.name, amount:amount }].concat(remoteCur.history||[]);
        remoteCur.timerValue = state.config.timerSeconds;
        return remoteCur;
      }, function(error, committed){
        if(error){ showError("연결 오류, 다시 시도해주세요"); return; }
        if(!committed){ showError("다른 팀이 먼저 입찰했습니다"); return; }
      });
      return;
    }

    cur.bid = amount;
    cur.bidTeamId = teamId;
    cur.history.unshift({ teamName:team.name, amount:amount });
    cur.timerValue = state.config.timerSeconds;
    render(); save();
  }
  actions.quickBid = function(teamId){
    var cur = state.current;
    if(!cur) return;
    var amount = cur.bid>0 ? cur.bid + state.config.increment : state.config.startBid;
    applyBid(teamId, amount);
  };
  actions.captainQuickBid = function(){
    actions.quickBid(CAPTAIN_TEAM_ID);
  };
  actions.captainCustomBid = function(){
    var amt = document.getElementById("captainCustomAmount");
    if(!amt) return;
    var amount = parseInt(amt.value,10);
    applyBid(CAPTAIN_TEAM_ID, amount);
    amt.value = "";
  };

  actions.startTimer = function(){
    if(state.current && !state.current.resolved){
      state.current.timerRunning = true;
      render(); save();
    }
  };
  actions.pauseTimer = function(){
    if(state.current){ state.current.timerRunning = false; render(); save(); }
  };
  actions.addTime = function(sec){
    if(state.current && !state.current.resolved){
      state.current.timerValue = Math.max(0, state.current.timerValue + parseInt(sec,10));
      updateTimerUI(); save();
    }
  };

  function resolveSold(){
    var cur = state.current;
    if(!cur || !cur.bidTeamId || cur.resolved) return;
    var team = findTeam(cur.bidTeamId);
    var player = findPlayer(cur.playerId);
    if(!team || !player) return;
    team.remaining -= cur.bid;
    team.roster.push({ playerId:player.id, name:player.name, position:player.position, price:cur.bid });
    player.status = "sold"; player.soldTeamId = team.id; player.price = cur.bid;
    cur.timerRunning = false; cur.resolved = true;
    cur.resultText = team.name + " 낙찰 · " + cur.bid + "P";
    state.log.unshift({ type:"sold", text: player.name + " → " + team.name + " (" + cur.bid + "P)" });
    render(); save();
  }
  function resolvePassed(){
    var cur = state.current;
    if(!cur || cur.resolved) return;
    var player = findPlayer(cur.playerId);
    if(!player) return;
    player.status = "passed";
    state.passedOrder.push(player.id);
    cur.timerRunning = false; cur.resolved = true;
    cur.resultText = "유찰";
    state.log.unshift({ type:"passed", text: player.name + " 유찰" });
    render(); save();
  }
  actions.sellNow = resolveSold;
  actions.passNow = resolvePassed;

  actions.requeuePassed = function(id){
    var idx = state.passedOrder.indexOf(id);
    if(idx<0) return;
    state.passedOrder.splice(idx,1);
    var player = findPlayer(id);
    if(player) player.status = "queued";
    state.order.push(id);
    render(); save();
  };
  actions.requeueAllPassed = function(){
    state.passedOrder.forEach(function(id){
      var player = findPlayer(id);
      if(player) player.status = "queued";
      state.order.push(id);
    });
    state.passedOrder = [];
    goNext();
  };

  actions.endAuction = function(){
    if(!confirm("경매를 지금 종료할까요? 남은 선수는 결과에서 미판매로 표시됩니다.")) return;
    state.phase = "finished";
    state.current = null;
    render(); save();
  };
  actions.resetAll = function(){
    if(!confirm("모든 데이터를 초기화하고 새로 시작할까요? 되돌릴 수 없습니다.")) return;
    state = defaultState();
    render(); save();
  };

  function globalToast(msg){
    var el = document.getElementById("globalToast");
    if(!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(globalToast._t);
    globalToast._t = setTimeout(function(){ el.classList.remove("show"); }, 2500);
  }
  actions.copyCaptainLink = function(teamId){
    var team = findTeam(teamId);
    if(!team) return;
    if(fbEnabled && !roomId){
      roomId = genRoomId();
      try{ localStorage.setItem(ROOM_ID_KEY, roomId); }catch(e){}
      attachSync();
      save();
    }
    var link = captainLink(teamId);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){
        globalToast(team.name+" 팀장 링크가 복사되었습니다");
      }).catch(function(){ globalToast(link); });
    }else{
      globalToast(link);
    }
  };
  actions.copyAllCaptainLinks = function(){
    if(fbEnabled && !roomId){
      roomId = genRoomId();
      try{ localStorage.setItem(ROOM_ID_KEY, roomId); }catch(e){}
      attachSync();
      save();
    }
    var text = state.teams.map(function(t){ return t.name+": "+captainLink(t.id); }).join("\n");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        globalToast("모든 팀장 링크가 복사되었습니다");
      }).catch(function(){ globalToast("복사에 실패했습니다"); });
    }else{
      globalToast("복사에 실패했습니다");
    }
  };

  actions.copyResults = function(){
    var text = buildResultText();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        toast("결과가 클립보드에 복사되었습니다");
      }).catch(function(){ toast("복사에 실패했습니다. 아래 상자에서 직접 복사하세요"); });
    }else{
      toast("아래 상자에서 직접 복사하세요");
    }
  };
  function toast(msg){
    var el = document.getElementById("finishToast");
    if(!el) return;
    el.textContent = msg;
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ if(el) el.textContent=""; }, 3000);
  }

  function buildResultText(){
    var lines = ["=== 내전 경매 결과 ==="];
    state.teams.forEach(function(t){
      lines.push("");
      lines.push("["+t.name+"] "+(t.total-t.remaining)+"P 사용 / "+t.total+"P");
      if(t.roster.length===0){ lines.push(" - (없음)"); }
      t.roster.forEach(function(r){
        lines.push(" - "+r.name+(r.position?" ("+r.position+")":"")+" : "+r.price+"P");
      });
    });
    var unsold = state.players.filter(function(p){ return p.status!=="sold"; });
    if(unsold.length){
      lines.push("");
      lines.push("[미판매]");
      unsold.forEach(function(p){ lines.push(" - "+p.name); });
    }
    return lines.join("\n");
  }

  /* ---------------- rendering ---------------- */

  var app = document.getElementById("app");

  function updateTimerUI(){
    var cur = state.current;
    if(!cur) return;
    var valEl = document.getElementById("timerValue");
    var fillEl = document.getElementById("timerFill");
    var boxEl = document.getElementById("timerBox");
    if(valEl) valEl.textContent = cur.timerValue;
    if(fillEl) fillEl.style.width = Math.max(0, (cur.timerValue/state.config.timerSeconds)*100) + "%";
    if(boxEl) boxEl.classList.toggle("urgent", cur.timerValue<=5);
  }

  function render(){
    /* re-renders can be triggered by a remote Firebase update (e.g. the
       admin's timer ticking every second) while the user is mid-typing in
       an input here, which would otherwise wipe it out on every rebuild */
    var active = document.activeElement;
    var restore = null;
    if(active && active.id && (active.tagName==="INPUT" || active.tagName==="TEXTAREA")){
      restore = { id:active.id, value:active.value, selStart:active.selectionStart, selEnd:active.selectionEnd };
    }

    if(IS_CAPTAIN_VIEW){
      app.classList.add("captain-app");
      app.innerHTML = captainAppHtml();
    }else{
      var html = headerHtml();
      if(state.phase==="setup") html += setupHtml();
      else if(state.phase==="waiting") html += waitingHtml();
      else if(state.phase==="auction") html += auctionHtml();
      else html += finishedHtml();
      app.innerHTML = html;
    }

    if(state.phase==="auction") syncAuctionSounds(state.current);
    else soundTrack.playerId = undefined;

    if(restore){
      var el = document.getElementById(restore.id);
      if(el && (el.tagName==="INPUT" || el.tagName==="TEXTAREA")){
        el.value = restore.value;
        el.focus();
        if(typeof restore.selStart==="number"){
          try{ el.setSelectionRange(restore.selStart, restore.selEnd); }catch(e){}
        }
      }
    }
  }

  function headerHtml(){
    var mid = "";
    var right = "";
    if(state.phase==="waiting"){
      mid = '<div class="header-mid">팀장 연결 대기중</div>';
      right = '<button class="btn btn-ghost btn-sm" data-action="resetAll">초기화</button>';
    }else if(state.phase==="auction"){
      var done = state.players.filter(function(p){return p.status==="sold"||p.status==="passed";}).length;
      mid = '<div class="header-mid">진행 <span class="num">'+done+' / '+state.players.length+'</span></div>';
      right = '<button class="btn btn-danger btn-sm" data-action="endAuction">경매 종료</button>'+
              '<button class="btn btn-ghost btn-sm" data-action="resetAll">초기화</button>';
    }else if(state.phase==="finished"){
      right = '<button class="btn btn-ghost btn-sm" data-action="resetAll">새 경매 시작</button>';
    }
    return '<div class="header">'+
      '<div class="brand"><span class="brand-mark">내전 경매</span><span class="brand-sub">진행자 콘솔</span></div>'+
      mid+
      '<div class="header-right">'+right+'</div>'+
    '</div>';
  }

        '<div><span class="field-label">슬롯</span>'+

        '<button class="row-remove" title="팀 삭제" data-action="removeTeam" data-id="'+t.id+'">&times;</button>'+

      '<div class="card">'+

          '<div style="display:flex;gap:8px;">'+
            '<button class="btn btn-ghost btn-sm" data-action="loadSample">샘플로 채우기</button>'+

          '</div></div>'+

      '<div class="card">'+
        '<div class="card-head"><h2>경매 옵션</h2></div>'+
        '<div class="config-grid">'+
          '<div><span class="field-label">시작 입찰가</span><input type="number" min="0" step="10" value="'+state.config.startBid+'" data-scope="config" data-field="startBid"></div>'+
          '<div><span class="field-label">입찰 단위</span><input type="number" min="1" step="10" value="'+state.config.increment+'" data-scope="config" data-field="increment"></div>'+
          '<div><span class="field-label">타이머(초)</span><input type="number" min="5" step="5" value="'+state.config.timerSeconds+'" data-scope="config" data-field="timerSeconds"></div>'+
        '</div>'+
      '</div>'+

      '<div class="card">'+
        '<div class="card-head"><h2>선수 목록</h2><span class="hint">한 줄에 한 명, "이름,포지션,챔프1/챔프2/챔프3,한줄 소감" 형식 가능</span></div>'+

        '<div class="player-table">'+
          '<div class="player-row head"><span>사진</span><span>이름</span><span>포지션</span><span>모스트픽 1</span><span>모스트픽 2</span><span>모스트픽 3</span><span>한줄 소감</span><span></span></div>'+

      '</div>'+

    '</div></div>';
  }

  function waitingHtml(){
    var rows = state.teams.map(function(t){
      return '<div class="waiting-team-row">'+
        '<span class="waiting-team-name">'+escapeHtml(t.name)+'</span>'+
        '<button class="btn btn-sm" data-action="copyCaptainLink" data-id="'+t.id+'">링크 복사</button>'+
      '</div>';
    }).join("");

  /* ---------------- events ---------------- */

  app.addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if(!btn) return;
    var action = btn.getAttribute("data-action");
    var id = btn.getAttribute("data-id");
    if(actions[action]) actions[action](id);
  });

  app.addEventListener("input", function(e){
    var el = e.target;
    var scope = el.dataset.scope;
    if(!scope) return;
    var field = el.dataset.field;

    if(scope==="team"){
      if(!field) return;
      var team = findTeam(el.dataset.id);
      if(!team) return;
      if(field==="name") team.name = el.value;
      else if(field==="total") team.total = Math.max(0, parseInt(el.value||"0",10));
      else if(field==="slots") team.slots = Math.max(1, parseInt(el.value||"1",10));
      save();
      var startBtn = app.querySelector('[data-action="startAuction"]');
      if(startBtn) startBtn.disabled = !canStart();
    }else if(scope==="config"){
      if(!field) return;
      state.config[field] = Math.max(0, parseInt(el.value||"0",10));
      save();
    }else if(scope==="player"){
      if(!field) return;
      var player = findPlayer(el.dataset.id);
      if(!player) return;
      if(field==="name") player.name = el.value;
      else if(field==="position") player.position = el.value;
      else if(field==="desc") player.desc = el.value;
      save();
    }else if(scope==="picksearch"){
      var dropdown = el.parentElement.querySelector(".pick-dropdown");
      if(!dropdown) return;
      var results = filterChampions(el.value, 8);
      if(results.length){
        dropdown.innerHTML = pickDropdownItemsHtml(results);
        dropdown.hidden = false;
      }else{
        dropdown.innerHTML = "";
        dropdown.hidden = true;
      }
    }
  });

  app.addEventListener("focusin", function(e){
    var el = e.target;
    if(!el.dataset || el.dataset.scope!=="picksearch") return;
    var dropdown = el.parentElement.querySelector(".pick-dropdown");
    if(!dropdown || !el.value) return;
    var results = filterChampions(el.value, 8);
    if(results.length){
      dropdown.innerHTML = pickDropdownItemsHtml(results);
      dropdown.hidden = false;
    }
  });

  app.addEventListener("focusout", function(e){
    var el = e.target;
    if(!el.dataset || el.dataset.scope!=="picksearch") return;
    var player = findPlayer(el.dataset.id);
    var slot = parseInt(el.dataset.slot,10);
    if(player){
      if(!player.picks) player.picks = ["","",""];
      player.picks[slot] = el.value;
      save();
    }
    var wrap = el.closest(".pick-search");
    var iconEl = wrap ? wrap.querySelector(".pick-icon") : null;
    if(iconEl) iconEl.outerHTML = pickIconHtml(el.value);
    var dropdown = el.parentElement.querySelector(".pick-dropdown");
    if(dropdown){ dropdown.hidden = true; dropdown.innerHTML = ""; }
  });

  app.addEventListener("mousedown", function(e){
    var item = e.target.closest(".pick-dropdown-item");
    if(!item) return;
    e.preventDefault();
    var box = item.closest(".pick-search-box");
    var input = box ? box.querySelector(".pick-search-input") : null;
    if(!input) return;
    var champ = CHAMP_DB[parseInt(item.getAttribute("data-champ"),10)];
    if(!champ) return;
    var player = findPlayer(input.dataset.id);
    var slot = parseInt(input.dataset.slot,10);
    if(!player) return;
    if(!player.picks) player.picks = ["","",""];
    player.picks[slot] = champ.name;
    input.value = champ.name;
    var wrap = input.closest(".pick-search");
    var iconEl = wrap ? wrap.querySelector(".pick-icon") : null;
    if(iconEl) iconEl.outerHTML = pickIconHtml(champ.name);
    var dropdown = box.querySelector(".pick-dropdown");
    if(dropdown){ dropdown.hidden = true; dropdown.innerHTML = ""; }
    save();
  });

  app.addEventListener("keydown", function(e){
    var el = e.target;
    if(!el.dataset || el.dataset.scope!=="picksearch") return;
    if(e.key==="Escape"){
      var dropdown = el.parentElement.querySelector(".pick-dropdown");
      if(dropdown){ dropdown.hidden = true; dropdown.innerHTML = ""; }
      el.blur();
    }else if(e.key==="Enter"){
      e.preventDefault();
      var box = el.closest(".pick-search-box");
      var firstItem = box ? box.querySelector(".pick-dropdown-item") : null;
      if(firstItem) firstItem.dispatchEvent(new MouseEvent("mousedown", { bubbles:true }));
      el.blur();
    }
  });

  /* ---------------- player photo upload + crop ---------------- */

  var PHOTO_MAX_BYTES = 8*1024*1024;
  var PHOTO_CROP_RATIO = 220/331; // matches the showcase portrait frame's aspect ratio
  var PHOTO_OUT_W = 480;
  var PHOTO_OUT_H = Math.round(PHOTO_OUT_W/PHOTO_CROP_RATIO);

  var photoFileInput = document.getElementById("photoFileInput");
  var cropOverlay = document.getElementById("cropOverlay");
  var cropViewport = document.getElementById("cropViewport");
  var cropImgEl = document.getElementById("cropImg");
  var cropZoomInput = document.getElementById("cropZoom");
  var cropApplyBtn = document.getElementById("cropApplyBtn");
  var cropCancelBtn = document.getElementById("cropCancelBtn");

  var cropCtx = null;   // { playerId, img, cw, ch, baseScale, zoom, offsetX, offsetY }
  var cropDrag = null;  // { startX, startY, startOffsetX, startOffsetY }

  function closeCropModal(){
    if(cropOverlay) cropOverlay.hidden = true;
    cropCtx = null;
    cropDrag = null;
  }

  function clampCropOffsets(){
    var scale = cropCtx.baseScale*cropCtx.zoom;
    var dw = cropCtx.img.naturalWidth*scale, dh = cropCtx.img.naturalHeight*scale;
    cropCtx.offsetX = Math.min(0, Math.max(cropCtx.cw-dw, cropCtx.offsetX));
    cropCtx.offsetY = Math.min(0, Math.max(cropCtx.ch-dh, cropCtx.offsetY));
  }
  function applyCropTransform(){
    if(!cropCtx || !cropImgEl) return;
    clampCropOffsets();
    var scale = cropCtx.baseScale*cropCtx.zoom;
    cropImgEl.style.transform = "translate("+cropCtx.offsetX+"px,"+cropCtx.offsetY+"px) scale("+scale+")";
  }

  function openCropModal(playerId, dataUrl){
    if(!cropOverlay || !cropViewport || !cropImgEl) return;
    var img = new Image();
    img.onload = function(){
      var cw = cropViewport.clientWidth || 220, ch = cropViewport.clientHeight || 331;
      var baseScale = Math.max(cw/img.naturalWidth, ch/img.naturalHeight);
      cropCtx = {
        playerId: playerId, img: img, cw: cw, ch: ch, baseScale: baseScale, zoom: 1,
        offsetX: (cw-img.naturalWidth*baseScale)/2,
        offsetY: (ch-img.naturalHeight*baseScale)/2
      };
      cropImgEl.src = dataUrl;
      cropImgEl.style.width = img.naturalWidth+"px";
      cropImgEl.style.height = img.naturalHeight+"px";
      if(cropZoomInput) cropZoomInput.value = 100;
      applyCropTransform();
      cropOverlay.hidden = false;
    };
    img.src = dataUrl;
  }

  if(photoFileInput){
    photoFileInput.addEventListener("change", function(){
      var file = photoFileInput.files && photoFileInput.files[0];
      photoFileInput.value = "";
      if(!file || !pendingPhotoPlayerId) return;
      if(!/^image\//.test(file.type)){ globalToast("이미지 파일만 업로드할 수 있습니다"); return; }
      if(file.size > PHOTO_MAX_BYTES){ globalToast("사진 용량은 8MB 이하로 올려주세요"); return; }
      var reader = new FileReader();
      reader.onload = function(){ openCropModal(pendingPhotoPlayerId, reader.result); };
      reader.readAsDataURL(file);
    });
  }

  if(cropViewport){
    var onCropMove = function(x,y){
      if(!cropDrag || !cropCtx) return;
      cropCtx.offsetX = cropDrag.startOffsetX + (x-cropDrag.startX);
      cropCtx.offsetY = cropDrag.startOffsetY + (y-cropDrag.startY);
      applyCropTransform();
    };
    var onCropStart = function(x,y){
      if(!cropCtx) return;
      cropDrag = { startX:x, startY:y, startOffsetX:cropCtx.offsetX, startOffsetY:cropCtx.offsetY };
      cropViewport.classList.add("dragging");
    };
    var onCropEnd = function(){
      cropDrag = null;
      cropViewport.classList.remove("dragging");
    };
    cropViewport.addEventListener("mousedown", function(e){ onCropStart(e.clientX, e.clientY); });
    window.addEventListener("mousemove", function(e){ if(cropDrag) onCropMove(e.clientX, e.clientY); });
    window.addEventListener("mouseup", onCropEnd);
    cropViewport.addEventListener("touchstart", function(e){
      var t = e.touches[0]; onCropStart(t.clientX, t.clientY);
    }, { passive:true });
    cropViewport.addEventListener("touchmove", function(e){
      var t = e.touches[0]; onCropMove(t.clientX, t.clientY);
    }, { passive:true });
    cropViewport.addEventListener("touchend", onCropEnd);
  }

  if(cropZoomInput){
    cropZoomInput.addEventListener("input", function(){
      if(!cropCtx) return;
      cropCtx.zoom = parseInt(cropZoomInput.value,10)/100;
      applyCropTransform();
    });
  }

  if(cropCancelBtn) cropCancelBtn.addEventListener("click", closeCropModal);

  if(cropApplyBtn){
    cropApplyBtn.addEventListener("click", function(){
      if(!cropCtx) return;
      var canvas = document.createElement("canvas");
      canvas.width = PHOTO_OUT_W; canvas.height = PHOTO_OUT_H;
      var ctx = canvas.getContext("2d");
      var scale = cropCtx.baseScale*cropCtx.zoom;
      var srcX = -cropCtx.offsetX/scale, srcY = -cropCtx.offsetY/scale;
      var srcW = cropCtx.cw/scale, srcH = cropCtx.ch/scale;
      ctx.drawImage(cropCtx.img, srcX, srcY, srcW, srcH, 0, 0, PHOTO_OUT_W, PHOTO_OUT_H);
      var dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      var player = findPlayer(cropCtx.playerId);
      if(player){ player.photoDataUrl = dataUrl; render(); save(); }
      closeCropModal();
    });
  }

  /* ---------------- background music + bid chime ---------------- */

  /* Browsers block audio autoplay until the page has been interacted
     with at all, so "on by default" means: start on the very first
     click anywhere (not just the speaker button) unless the user has
     explicitly muted before. The button then just toggles that. */
  var BGM_MUTED_KEY = "naejeon_bgm_muted_v1";
  var bgmAudio = document.getElementById("bgmAudio");
  var bgmToggle = document.getElementById("bgmToggle");
  var bgmUserMuted = false;
  try{ bgmUserMuted = localStorage.getItem(BGM_MUTED_KEY)==="1"; }catch(e){}
  var bgmStarted = false;

  function setBgmToggleUI(){
    if(!bgmToggle) return;
    var playing = bgmAudio && !bgmAudio.paused;
    bgmToggle.innerHTML = (playing || !bgmUserMuted) ? "&#128266;" : "&#128264;";
    bgmToggle.classList.toggle("playing", playing);
  }
  function bgmSync(){
    if(!bgmAudio) return;
    if(bgmUserMuted){
      if(!bgmAudio.paused) bgmAudio.pause();
    }else if(bgmAudio.paused){
      bgmAudio.volume = 0.35;
      bgmAudio.play().then(function(){ bgmStarted = true; setBgmToggleUI(); }).catch(function(){});
    }
    setBgmToggleUI();
  }
  function unlockAudio(){
    var ctx = getAudioCtx();
    if(ctx && ctx.state==="suspended") ctx.resume().catch(function(){});
  }
  document.addEventListener("click", function(){
    unlockAudio();
    if(!bgmStarted) bgmSync();
  });
  if(bgmToggle){
    bgmToggle.addEventListener("click", function(e){
      e.stopPropagation();
      unlockAudio();
      bgmUserMuted = !bgmUserMuted;
      try{ localStorage.setItem(BGM_MUTED_KEY, bgmUserMuted?"1":"0"); }catch(e){}
      bgmStarted = true;
      bgmSync();
    });
  }
  setBgmToggleUI();

  /* short synthesized sound effects for bidding/resolving/advancing —
     no audio files needed, so there's nothing to license */
  var audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    }
    return audioCtx;
  }
  function playTone(freq, type, start, dur, peakGain){
    var ctx = getAudioCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(peakGain, start+0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, start+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(start); osc.stop(start+dur+0.05);
    return osc;
  }
  function playBidChime(){
    var ctx = getAudioCtx();
    if(!ctx || ctx.state==="suspended") return;
    var now = ctx.currentTime;
    [880, 1318.51].forEach(function(freq, i){ playTone(freq, "sine", now+i*0.08, 0.5, 0.22); });
  }
  function playSoldFanfare(){
    var ctx = getAudioCtx();
    if(!ctx || ctx.state==="suspended") return;
    var now = ctx.currentTime;
    [523.25, 659.25, 783.99].forEach(function(freq, i){ playTone(freq, "triangle", now+i*0.1, 0.6, 0.28); });
  }
  function playNextPlayerChime(){
    var ctx = getAudioCtx();
    if(!ctx || ctx.state==="suspended") return;
    var now = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(587.33, now);
    osc.frequency.exponentialRampToValueAtTime(880, now+0.15);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.2, now+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now+0.35);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now+0.4);
  }

  var soundTrack = { playerId:undefined, bid:0, resolved:false };
  function syncAuctionSounds(cur){
    if(!cur){ soundTrack.playerId = undefined; return; }
    if(cur.playerId !== soundTrack.playerId){
      soundTrack.playerId = cur.playerId;
      soundTrack.bid = cur.bid||0;
      soundTrack.resolved = cur.resolved;
      playNextPlayerChime();
      return;
    }
    if((cur.bid||0) > soundTrack.bid) playBidChime();
    soundTrack.bid = cur.bid||0;
    if(cur.resolved && !soundTrack.resolved && cur.bidTeamId) playSoldFanfare();
    soundTrack.resolved = cur.resolved;
  }

  /* ---------------- timer loop (admin device only — captains just read the synced value) ---------------- */

  if(!IS_CAPTAIN_VIEW){
    setInterval(function(){
      if(state.phase!=="auction" || !state.current || !state.current.timerRunning || state.current.resolved) return;
      state.current.timerValue -= 1;
      if(state.current.timerValue<=0){
        state.current.timerValue = 0;
        state.current.timerRunning = false;
        if(state.current.bidTeamId) resolveSold(); else resolvePassed();
      }else{
        updateTimerUI();
        save();
      }
    }, 1000);
  }

  render();
})();
</script>
